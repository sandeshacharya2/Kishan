{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8" />
    <title>{% trans "Password Reset Complete" %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f8;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            background: white;
            margin: 100px auto;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .message.success {
            color: #2e7d32;
            font-weight: 600;
            margin-bottom: 20px;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>{% trans "Your password has been successfully changed." %}</h2>
        <p class="message success">
            {% trans "Your password has been successfully changed. You can now" %} <a href="{% url 'login' %}">{% trans "log in" %}</a>.
        </p>
    </div>
</body>
</html>
