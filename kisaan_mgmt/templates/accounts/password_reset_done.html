{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Password Reset Email Sent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: #ffffff;
            padding: 35px 50px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            text-align: center;
        }

        h2 {
            color: #222222;
            font-size: 1.9rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .message.success {
            color: #28a745; /* Bootstrap green */
            font-size: 1.15rem;
            margin-bottom: 25px;
        }

        a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #0056b3;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Password Reset Email Sent</h2>
        <p class="message success">
            If an account with the email you provided exists, you will receive an email with instructions to reset your password shortly.
        </p>
        <p>
            Return to <a href="{% url 'login' %}">Login</a> page.
        </p>
    </div>
</body>
</html>
