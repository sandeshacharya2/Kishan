{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>पासवर्ड रिसेट इमेल पठाइयो</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Optional: Google Fonts for better Nepali readability (Noto Sans Devanagari) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            500: '#2e7d32',
                            600: '#1b5e20',
                            100: '#e8f5e9',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans Devanagari', 'Segoe UI', sans-serif;
        }
        .check-icon {
            color: #2e7d32;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center border border-green-100">
        <!-- Success Icon -->
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <!-- Title -->
        <h2 class="text-2xl font-bold text-gray-800 mb-4">
            {% trans "पासवर्ड रिसेट इमेल पठाइएको छ" %}
        </h2>

        <!-- Message -->
        <p class="text-gray-600 mb-6 leading-relaxed">
            {% trans "तपाईंले दिएको इमेल ठेगानासँग खाता रहेको खण्डमा, पासवर्ड रिसेट गर्नका लागि निर्देशनसहितको इमेल छिट्टै प्राप्त गर्नुहुनेछ।" %}
        </p>

        <!-- Back to Login -->
        <a href="{% url 'login' %}" 
           class="inline-block px-6 py-3 bg-primary-500 text-white font-semibold rounded-lg hover:bg-primary-600 transition-all duration-200 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-primary-300">
            {% trans "लगइन पृष्ठमा फर्किनुहोस्" %}
        </a>
    </div>
</body>
</html>
