{% load i18n %}
<div class="pt-20 lg:ml-72">
  <main class="p-6 pt-0 overflow-y-auto bg-green-50">
    <!-- products and content -->
  </main>

  <!-- Footer -->
  <footer class="bg-gradient-to-r from-green-900 via-green-800 to-green-700 text-white mt-12 shadow-inner">
    <div class="max-w-screen-xl mx-auto px-6 py-8 flex flex-col md:flex-row md:items-center md:justify-between gap-8">

      <!-- Left: Logo & Tagline -->
      <div class="space-y-2 text-center md:text-left md:basis-1/4 flex-shrink-0">
        <h2 class="text-2xl font-extrabold tracking-wide">🌿 {% trans "Farmer Market" %}</h2>
        <p class="text-sm text-green-300 italic">“{% trans "Your choice, our market" %}”</p>
      </div>

      <!-- Middle: Navigation -->
      <div class="flex flex-wrap md:flex-nowrap justify-center md:justify-center gap-6 text-sm font-medium md:basis-1/2">
        <a href="{% url 'customer-dashboard' %}" class="hover:text-lime-400 transition-colors">🏠 {% trans "Dashboard" %}</a>
        <a href="{% url 'payments:customer_purchases' %}" class="hover:text-lime-400 transition-colors">🛒 {% trans "Orders" %}</a>
        <a href="{% url 'update-customer-profile' %}" class="hover:text-lime-400 transition-colors">👤 {% trans "Profile" %}</a>
        <a href="#" class="hover:text-lime-400 transition-colors">📞 {% trans "Support" %}</a>
      </div>

      <!-- Right: Copyright -->
      <div class="text-center md:text-right text-xs text-green-300 md:basis-1/4 flex-shrink-0">
        <p>&copy; 2025 {% trans "Farmer Market. All rights reserved." %}</p>
        <p class="mt-1">💚 {% trans "Made with love for farmers" %}</p>
      </div>

    </div>
  </footer>
</div>
