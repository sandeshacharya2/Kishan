{% load i18n %}
{% load static %}

<header class="fixed top-0 left-0 right-0 z-40 bg-gradient-to-r from-green-700 via-emerald-600 to-lime-600 shadow-lg ">
  <div class="lg:ml-72">
    <div class="max-w-screen-2xl mx-auto px-4 py-3 flex items-center justify-between">

      <!-- Left side -->
      <div class="flex items-center gap-3">
        <img src="{% static 'accounts/images/download.jpg' %}" alt="Logo"
             class="w-11 h-11 rounded-full border-2 border-white shadow-md object-cover" />
        <div class="flex flex-col leading-tight">
          <span class="text-white font-extrabold text-xl tracking-wide">{% trans "Farmer Dashboard" %}</span>
          <span class="text-sm text-lime-200 italic">“{% trans "Production, Progress & Market" %}”</span>
        </div>
      </div>

      <!-- Right side -->
      <div class="flex items-center gap-4">
         <form action="{% url 'set_language' %}" method="post" class="flex items-center">
            {% csrf_token %}
            <select name="language" onchange="this.form.submit()" class="bg-white text-green-800 font-semibold px-3 py-2 rounded-lg cursor-pointer shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500">
              {% get_current_language as LANGUAGE_CODE %}
              {% get_available_languages as LANGUAGES %}
              {% for lang_code, lang_name in LANGUAGES %}
                <option value="{{ lang_code }}" {% if lang_code == LANGUAGE_CODE %}selected{% endif %}>{{ lang_name }}</option>
              {% endfor %}
            </select>
            <input type="hidden" name="next" value="{{ request.path }}">
          </form>
        <span class="hidden sm:inline text-white font-medium">{% trans "Hello," %} {{ user.first_name }} {{ user.last_name }}</span>
        {% if user.farmerprofile.profile_picture %}
          <img src="{{ user.farmerprofile.profile_picture.url }}" alt="Profile"
               class="w-10 h-10 rounded-full border-2 border-white shadow-md" />
        {% else %}
          <img src="{% static 'default_profile.jpg' %}" alt="Profile"
               class="w-10 h-10 rounded-full border-2 border-white shadow-md" />
        {% endif %}

        <!-- Mobile Menu Button (Hamburger) -->
        <button id="mobile-sidebar-toggle" 
                class="lg:hidden text-white text-3xl focus:outline-none">
          ☰
        </button>
      </div>
    </div>
  </div>
</header>
