<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <title>नयाँ पासवर्ड सेट गर्नुहोस्</title>
    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }

        input[type="password"] {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #5a67d8;
        }

        .errorlist {
            color: red;
            margin-bottom: 10px;
            list-style-type: none;
            padding: 0;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>नयाँ पासवर्ड सेट गर्नुहोस्</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div>
            {{ form.new_password1.label_tag }} <!-- Usually: नयाँ पासवर्ड -->
            {{ form.new_password1 }}
            {{ form.new_password1.errors }}
        </div>
        <div>
            {{ form.new_password2.label_tag }} <!-- Usually: पासवर्ड पुन: पुष्टि गर्नुहोस् -->
            {{ form.new_password2 }}
            {{ form.new_password2.errors }}
        </div>
        <button type="submit">पासवर्ड रिसेट गर्नुहोस्</button>
    </form>
</div>
</body>
</html>
