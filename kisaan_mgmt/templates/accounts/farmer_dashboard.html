<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Farmer Dashboard</title>
</head>
<body>
    <h1>Welcome, Farmer {{ user.username }}!</h1>
    <p>This is your dashboard.</p>

    <nav>

    Logout
  </button>
</form>    </nav>
</body>
</html>
