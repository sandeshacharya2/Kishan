{% extends 'accounts/customer_base.html' %}
{% load static %}
{% load i18n %}

{% block title %}{% trans "Edit Customer Profile" %}{% endblock %}

{% block content %}
<style>
  .image-preview-container {
    position: relative;
    display: inline-block;
    margin: 0 auto;
  }
  .image-preview-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.3s;
    cursor: pointer;
  }
  .image-preview-container:hover .image-preview-overlay {
    opacity: 1;
  }
  .upload-icon {
    font-size: 1.5rem;
  }
</style>

<!-- Header -->
<!-- <header class="fixed top-0 left-0 right-0 z-40 bg-gradient-to-r from-emerald-700 via-green-600 to-lime-600 shadow-lg">
  <div class="container mx-auto px-4 py-3 text-center">
    <h1 class="text-xl md:text-2xl font-bold text-white drop-shadow">
      {% trans "Edit Your Profile" %}
    </h1>
  </div>
</header> -->

<!-- Main Content -->
<div class="pt-24 pb-12 px-4">
  <div class="max-w-lg mx-auto">

    {% if messages %}
      <div class="mb-6">
        {% for message in messages %}
          <div class="bg-gradient-to-r from-emerald-100 via-green-100 to-lime-100 text-green-900 px-4 py-3 rounded-xl text-center font-medium shadow-sm">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <div class="bg-white rounded-2xl shadow-lg border border-green-200 overflow-hidden">
      <form method="post" enctype="multipart/form-data" id="profile-form" class="p-6 md:p-8">
        {% csrf_token %}

        <!-- Name Fields -->
        <div class="space-y-5 mb-8">
          <div>
            <label for="id_first_name" class="block text-sm font-semibold text-gray-700 mb-2">
              {% trans "First Name" %}
            </label>
            <input
              type="text"
              name="first_name"
              id="id_first_name"
              value="{{ first_name }}"
              class="w-full px-4 py-3 border border-emerald-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
            >
          </div>

          <div>
            <label for="id_last_name" class="block text-sm font-semibold text-gray-700 mb-2">
              {% trans "Last Name" %}
            </label>
            <input
              type="text"
              name="last_name"
              id="id_last_name"
              value="{{ last_name }}"
              class="w-full px-4 py-3 border border-emerald-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition"
            >
          </div>
        </div>

        <!-- Profile Picture Upload Section -->
        <div class="text-center mb-8">
          <div class="image-preview-container">
            <img 
              id="profile-preview" 
              src="{% if profile_picture_url %}{{ profile_picture_url }}{% else %}{% static 'default_profile.jpg' %}{% endif %}"
              alt="{% trans 'Profile preview' %}"
              class="w-32 h-32 rounded-full object-cover border-4 border-white shadow-lg mx-auto"
            >
            <div class="image-preview-overlay">
              <span class="upload-icon">📷</span>
            </div>
          </div>

          <label for="id_profile_picture" class="mt-4 block text-emerald-800 font-medium cursor-pointer hover:text-green-900 transition">
            {% trans "Click to upload a new photo" %}
          </label>
          <input 
            type="file" 
            name="profile_picture" 
            id="id_profile_picture"
            accept="image/*"
            class="hidden"
          >
        </div>

        <!-- Submit Button -->
        <div class="mt-8">
          <button
            type="submit"
            class="w-full h-10 bg-gradient-to-r from-emerald-700 via-green-600 to-lime-600 hover:from-emerald-800 hover:via-green-700 hover:to-lime-700 text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl transition duration-300 transform hover:-translate-y-0.5"
          >
            {% trans "Save Changes" %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.getElementById('id_profile_picture').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('profile-preview').src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  });
</script>
{% endblock %}
