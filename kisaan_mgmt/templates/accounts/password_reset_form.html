{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Reset Password" %}</title>
    <style>
        /* Your existing CSS — unchanged */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .reset-box {
            position: relative;
            background: white;
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 100, 0, 0.15);
            width: 100%;
            max-width: 420px;
            border: 1px solid #e0f2e1;
        }
        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #f1f8f2;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            color: #4caf50;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .close-btn:hover {
            background: #e8f5e9;
            color: #2e7d32;
            transform: rotate(90deg);
        }
        h2 {
            margin-bottom: 24px;
            text-align: center;
            color: #2e7d32;
            font-size: 24px;
            font-weight: 700;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #388e3c;
        }
        input[type=email] {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 24px;
            border: 2px solid #c8e6c9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }
        input[type=email]:focus {
            outline: none;
            border-color: #4caf50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }
        button[type=submit] {
            background: #4caf50;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        button[type=submit]:hover {
            background: #388e3c;
            transform: translateY(-2px);
        }
        button[type=submit]:active {
            transform: translateY(0);
        }
        .errorlist {
            color: #d32f2f;
            font-size: 0.875rem;
            margin-top: -16px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="reset-box">
    <button class="close-btn" onclick="window.location.href='{% url 'login' %}'" title="Close">&times;</button>

    <h2>{% trans "Forgot Password?" %}</h2>
    <form method="post" id="reset-form">
        {% csrf_token %}
        {{ form.email.label_tag }}
        {{ form.email }}
        <ul id="client-error" class="errorlist" style="display: none;"></ul>
        {% if form.email.errors %}
            <ul id="server-error" class="errorlist">{{ form.email.errors }}</ul>
        {% endif %}
        <button type="submit" id="submit-btn" disabled>
            {% trans "Send password reset email" %}
        </button>
    </form>
</div>

<script>
    const emailInput = document.getElementById('id_email');
    const submitBtn = document.getElementById('submit-btn');
    const clientError = document.getElementById('client-error');
    const serverError = document.getElementById('server-error');
    const form = document.getElementById('reset-form');

    function hideErrors() {
        clientError.style.display = 'none';
        clientError.textContent = '';
        if (serverError) serverError.style.display = 'none';
    }

    function showClientError(message) {
        clientError.textContent = message;
        clientError.style.display = 'block';
        if (serverError) serverError.style.display = 'none';
    }

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    emailInput.addEventListener('input', () => {
        const email = emailInput.value.trim();
        hideErrors(); // ✅ Clear errors when user types

        if (email === '') {
            submitBtn.disabled = true;
        } else if (!isValidEmail(email)) {
            showClientError('Please enter a valid email address.');
            submitBtn.disabled = true;
        } else {
            submitBtn.disabled = false;
        }
    });

    form.addEventListener('submit', (e) => {
        const email = emailInput.value.trim();
        if (email === '') {
            e.preventDefault();
            showClientError('This field is required.');
        } else if (!isValidEmail(email)) {
            e.preventDefault();
            showClientError('Please enter a valid email address.');
        }
        // If valid, let the form submit → server will check if email exists
    });
</script>
</body>
</html>
