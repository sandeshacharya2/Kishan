<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8" />
    <title>पासवर्ड रिसेट पूरा भयो</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f8;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            background: white;
            margin: 100px auto;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .message.success {
            color: #2e7d32;
            font-weight: 600;
            margin-bottom: 20px;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>पासवर्ड सफलतापूर्वक परिवर्तन भयो</h2>
        <p class="message success">
            तपाईंको पासवर्ड सफलतापूर्वक परिवर्तन गरिएको छ। अब तपाईं <a href="{% url 'login' %}">लगइन</a> गर्न सक्नुहुन्छ।
        </p>
    </div>
</body>
</html>
