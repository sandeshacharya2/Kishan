{% load static %}
<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>किसान</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #edf6e5, #f7ffe5, #e2f3d8);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar-custom {
      background: linear-gradient(to right, #3b6e22, #4f8a10, #6aa84f);
    }
    .navbar-brand h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: bold;
      color: #fdf6e3;
    }
    .navbar-brand p {
      margin: 0;
      font-size: 0.85rem;
      color: #e9e5d6;
      font-style: italic;
    }
    .nav-link {
      color: #fff !important;
    }
    .nav-link:hover {
      color: #fff799 !important;
      text-decoration: underline;
    }
    .btn-login {
      background-color: #ffe066;
      color: #1b5e20;
      font-weight: 600;
    }
    .btn-login:hover {
      background-color: #ffeb99;
      color: #1b5e20;
    }
    .logo-img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      transition: transform 0.3s ease-in-out;
    }
    .logo-img:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-custom py-3 shadow-lg">
  <div class="container-fluid px-4">
    
    <!-- Logo + Title -->
    <a class="navbar-brand d-flex align-items-center gap-3" href="#">
      <img src="{% static 'accounts/images/download.jpg' %}" alt="किसान लोगो" class="logo-img">
      <div>
        <h1>किसान</h1>
        <p>हामी किसानको साथमा छौं</p>
      </div>
    </a>

    <!-- Toggle Button -->
    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Center Links and Right Login -->
    <div class="collapse navbar-collapse" id="navLinks">
      <!-- Navigation Links -->
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-3">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'landing' %}">गृहपृष्ठ</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'about' %}">हाम्रोबारे</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contact' %}">सम्पर्क गर्नुहोस्</a>
        </li>
      </ul>

      <!-- Login Button -->
      <div class="d-flex">
        <a href="{% url 'login' %}" class="btn btn-login shadow-sm">लगइन</a>
      </div>
    </div>
  </div>
</nav>

<!-- Bootstrap 5 JS (Required for navbar toggling) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
