{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Farmer" %}</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #edf6e5, #f7ffe5, #e2f3d8);
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar-custom {
      background: linear-gradient(to right, #3b6e22, #4f8a10, #6aa84f);
    }
    .navbar-brand h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: bold;
      color: #fdf6e3;
    }
    .navbar-brand p {
      margin: 0;
      font-size: 0.85rem;
      color: #e9e5d6;
      font-style: italic;
    }
    .nav-link {
      color: #fff !important;
    }
    .nav-link:hover {
      color: #fff799 !important;
      text-decoration: underline;
    }
    .btn-login {
      background-color: #ffe066;
      color: #1b5e20;
      font-weight: 600;
    }
    .btn-login:hover {
      background-color: #ffeb99;
      color: #1b5e20;
    }
    .logo-img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      transition: transform 0.3s ease-in-out;
    }
    .logo-img:hover {
      transform: scale(1.1);
    }
    /* Dropdown styles */
    .language-form select {
      background-color: #ffe066;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: 600;
      color: #1b5e20;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-left: 10px;
    }
    .language-form select:hover {
      background-color: #ffeb99;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-custom py-3 shadow-lg">
  <div class="container-fluid px-4">
    
    <!-- Logo + Title -->
    <a class="navbar-brand d-flex align-items-center gap-3" href="#">
      <img src="{% static 'accounts/images/download.jpg' %}" alt="किसान लोगो" class="logo-img">
      <div>
        <h1>{% trans "Farmer" %}</h1>
        <p>{% trans "We are with farmer" %}</p>
      </div>
    </a>

    <!-- Toggle Button -->
    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Center Links and Right Login + Language -->
    <div class="collapse navbar-collapse" id="navLinks">
      <!-- Navigation Links -->
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-3">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'landing' %}">{% trans "Home" %}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'about' %}">{% trans "About Us" %}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contact' %}">{% trans "Contact Us" %}</a>
        </li>
      </ul>

      <!-- Login Button and Language Dropdown -->
      <div class="d-flex align-items-center">
        <a href="{% url 'login' %}" class="btn btn-login shadow-sm">{% trans "Login" %}</a>

        <!-- Language Switcher Form -->
        <form action="{% url 'set_language' %}" method="post" class="language-form d-flex align-items-center">
          {% csrf_token %}
          <select name="language" onchange="this.form.submit()">
            {% get_current_language as LANGUAGE_CODE %}
            {% get_available_languages as LANGUAGES %}
            {% for lang_code, lang_name in LANGUAGES %}
              <option value="{{ lang_code }}" {% if lang_code == LANGUAGE_CODE %}selected{% endif %}>{{ lang_name }}</option>
            {% endfor %}
          </select>
          <input type="hidden" name="next" value="{{ request.path }}">
        </form>
      </div>
    </div>
  </div>
</nav>

<!-- Bootstrap 5 JS (Required for navbar toggling) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
