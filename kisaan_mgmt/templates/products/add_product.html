<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>उत्पादन थप्नुहोस्</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-green-50 to-green-200 min-h-screen flex flex-col items-center p-4">

  <!-- Title -->
  <h1 class="flex items-center gap-2 text-2xl sm:text-3xl font-bold text-green-700 mt-6 mb-2">
    🌾 उत्पादन थप्नुहोस्
  </h1>
  <p class="bg-green-100 text-green-800 px-4 py-2 rounded-xl shadow text-center text-sm sm:text-base">
    किसान साथी, यहाँबाट आफ्नो उत्पादन सजिलै थप्न सक्नुहुन्छ।
  </p>

  <!-- Form Card with Close Button -->
  <div class="relative bg-white shadow-lg rounded-2xl p-6 w-full max-w-md lg:max-w-3xl mt-6 border border-green-200">

    <!-- Close button top right -->
 

    <form method="post" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}

      <!-- Main Category -->
      <div>
        <label for="main-category" class="block font-semibold text-green-800">प्रकार छान्नुहोस् 🌱:</label>
        <select id="main-category" name="main_category" required
          class="w-full p-2 rounded-lg border border-green-200 focus:border-green-500 focus:ring focus:ring-green-200">
          <option value="">-- छान्नुहोस् --</option>
          <option value="तरकारी">तरकारी</option>
          <option value="फलफुल">फलफुल</option>
          <option value="खाद्यान्न">खाद्यान्न</option>
        </select>
      </div>

      <!-- Sub Category -->
      <div>
        <label for="sub-category" class="block font-semibold text-green-800">विवरण (उप-प्रकार) 📝:</label>
        <select id="sub-category" name="sub_category" required
          class="w-full p-2 rounded-lg border border-green-200 focus:border-green-500 focus:ring focus:ring-green-200">
          <option value="">-- कृपया प्रकार छान्नुहोस् --</option>
        </select>
        <input type="text" id="other-subcategory" name="other_subcategory" placeholder="अन्य विवरण लेख्नुहोस्"
          class="w-full mt-2 p-2 rounded-lg border border-green-200 hidden focus:border-green-500 focus:ring focus:ring-green-200">
      </div>

      <!-- Quantity & Unit -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="quantity" class="block font-semibold text-green-800">परिमाण 📦:</label>
          <input type="number" name="quantity" min="1" required id="quantity"
            class="w-full p-2 rounded-lg border border-green-200 focus:border-green-500 focus:ring focus:ring-green-200">
        </div>
        <div>
          <label for="unit" class="block font-semibold text-green-800">इकाइ ⚖️:</label>
          <select name="unit" required
            class="w-full p-2 rounded-lg border border-green-200 focus:border-green-500 focus:ring focus:ring-green-200">
            <option value="किलो">किलो</option>
            <option value="क्विन्टल">क्विन्टल</option>
            <option value="दर्जन">दर्जन</option>
            <option value="मुरी">मुरी</option>
          </select>
        </div>
      </div>

      <!-- Price -->
      <div>
        <label for="price" class="block font-semibold text-green-800">प्रति इकाइ मूल्य 💵:</label>
        <input type="number" name="price" id="price" min="0" step="0.01" required
          class="w-full p-2 rounded-lg border border-green-200 focus:border-green-500 focus:ring focus:ring-green-200"
          placeholder="प्रति इकाइ मूल्य">
        <p id="total-price" class="text-green-700 font-semibold mt-1"></p>
      </div>

      <!-- Description -->
      <div>
        <label for="description" class="block font-semibold text-green-800">विवरण 📝:</label>
        <textarea name="description" id="description" rows="4" maxlength="150"
          placeholder="उत्पादनको छोटकरीमा विवरण लेख्नुहोस् (अधिकतम 150 अक्षर)"
          class="w-full p-2 rounded-lg border border-green-200 focus:border-green-500 focus:ring focus:ring-green-200 resize-y"></textarea>
        <p id="char-count" class="text-sm text-gray-500 mt-1">0 / 150 अक्षर</p>
      </div>

      <!-- Image -->
      <div>
        <label for="image" class="block font-semibold text-green-800">उत्पादनको फोटो 🖼️:</label>
        <input type="file" name="image" id="image" accept="image/*"
          class="w-full p-2 rounded-lg border border-green-200 focus:border-green-500 focus:ring focus:ring-green-200">

        <!-- Image Preview Container -->
        <div id="image-preview-container" class="relative mt-4 hidden max-w-xs sm:max-w-md lg:max-w-lg mx-auto">
          <img id="image-preview" src="#" alt="Image Preview" class="rounded-lg w-full object-contain max-h-80" />
        </div>
      </div>

      <!-- Submit -->
      <button type="submit"
        class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition-transform transform hover:scale-[1.02]">
        ✅ सेभ गर्नुहोस्
      </button>
      <div class="mb-6">
      <a href="{% url 'farmer-dashboard' %}"
         class="inline-flex items-center px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition text-sm sm:text-base">
        ← Dashboard मा फर्कनुहोस्
      </a>
    </div>
    </form>
  </div>

  <script>
    // Subcategory logic
    const subcategories = {
      "तरकारी": ["आलु", "प्याज", "लसुन", "टमाटर", "बन्दा", "काउली", "मुला", "गाजर", "साग", "काक्रो", "भेनता", "सिमि", "बोडी", "लौका", "करेला", "खुर्सानी", "धनिया", "अदुवा", "फर्सी", "चिचिँडो", "अन्य"],
      "फलफुल": ["स्याउ", "केरा", "सुन्तला", "मेवा", "आँप", "नासपाती", "कागती", "भुइँकटहर", "अन्य"],
      "खाद्यान्न": ["धान", "गहुँ", "मकै", "जौ", "कोदो", "फापर", "चना", "मुसुरो", "मास", "बोडी", "सिमी", "स्याल्टुङ", "केराउ", "तोरी", "अन्य"]
    };

    const mainCategorySelect = document.getElementById("main-category");
    const subCategorySelect = document.getElementById("sub-category");
    const otherInput = document.getElementById("other-subcategory");

    mainCategorySelect.addEventListener("change", function () {
      const mainCat = this.value;
      subCategorySelect.innerHTML = "<option value=''>-- छान्नुहोस् --</option>";
      otherInput.classList.add("hidden");
      if (subcategories[mainCat]) {
        subcategories[mainCat].forEach(item => {
          const option = document.createElement("option");
          option.value = item;
          option.text = item;
          subCategorySelect.appendChild(option);
        });
      }
    });

    subCategorySelect.addEventListener("change", function () {
      otherInput.classList.toggle("hidden", this.value !== "अन्य");
    });

    // Total price calculation
    function updateTotalPrice() {
      const qty = parseFloat(document.getElementById("quantity").value) || 0;
      const price = parseFloat(document.getElementById("price").value) || 0;
      const total = qty * price;
      document.getElementById("total-price").textContent =
        (qty && price) ? `कुल मूल्य: रु ${total.toFixed(2)}` : "";
    }
    document.getElementById("quantity").addEventListener("input", updateTotalPrice);
    document.getElementById("price").addEventListener("input", updateTotalPrice);

    // Character counter
    const desc = document.getElementById("description");
    const charCount = document.getElementById("char-count");
    desc.addEventListener("input", function () {
      charCount.textContent = `${this.value.length} / 150 अक्षर`;
    });

    // Image preview logic
    const imageInput = document.getElementById("image");
    const previewContainer = document.getElementById("image-preview-container");
    const previewImage = document.getElementById("image-preview");

    imageInput.addEventListener("change", function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          previewImage.src = e.target.result;
          previewContainer.classList.remove("hidden");
        };
        reader.readAsDataURL(file);
      } else {
        previewImage.src = "#";
        previewContainer.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
