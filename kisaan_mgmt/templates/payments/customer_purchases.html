{% if t.payment_method == 'COD' and t.delivery_status == 'Completed' and t.payment_status == 'Pending' %}
  <form method="POST" action="{% url 'payments:cod_pay' t.id %}">
    {% csrf_token %}
    <button type="submit" class="px-3 py-1 bg-yellow-600 text-white rounded hover:bg-yellow-700 text-xs">
      Pay Now
    </button>
  </form>
{% else %}
  <span class="px-2 py-1 rounded text-xs font-semibold
    {% if t.payment_status == 'Success' %} bg-green-100 text-green-700
    {% elif t.payment_status == 'Pending' %} bg-yellow-100 text-yellow-700
    {% elif t.payment_status == 'Failed' %} bg-red-100 text-red-700
    {% else %} bg-gray-100 text-gray-600 {% endif %}">
    {{ t.payment_status }}
  </span>
{% endif %}
