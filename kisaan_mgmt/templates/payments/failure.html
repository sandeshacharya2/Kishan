<!DOCTYPE html>
<html>
<head>
    <title>Payment Failed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6e6;
            text-align: center;
            padding: 50px;
        }
        .box {
            background-color: #fff;
            border: 2px solid #f44336;
            border-radius: 10px;
            display: inline-block;
            padding: 30px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #f44336;
        }
        p {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>❌ Payment Failed</h1>
        <p>Something went wrong or the transaction was canceled.</p>
        <p>Please try again or contact support.</p><h2>Payment Failed</h2>
<p>Unfortunately, your payment could not be verified or was cancelled.</p>

{% if pid %}
<p>Transaction ID: {{ pid }}</p>
{% endif %}

<a href="{% url 'customer-dashboard' %}">Go back to Dashboard</a>

    </div>
</body>
</html>
