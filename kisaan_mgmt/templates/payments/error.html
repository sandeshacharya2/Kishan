<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff3f3;
            color: #b00020;
            text-align: center;
            padding: 60px 20px;
        }
        .error-box {
            max-width: 500px;
            margin: auto;
            background-color: #ffe6e6;
            border: 1px solid #b00020;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 10px rgba(176, 0, 32, 0.3);
        }
        h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }
        p {
            font-size: 18px;
            margin-bottom: 25px;
        }
        a.button {
            display: inline-block;
            background-color: #b00020;
            color: white;
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        a.button:hover {
            background-color: #7f0015;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>Oops! Something went wrong.</h1>
        {% if message %}
            <p>{{ message }}</p>
        {% else %}
            <p>An unexpected error has occurred. Please try again later.</p>
        {% endif %}
        <a href="{% url 'landing' %}" class="button">Go to Landing Page</a>
    </div>
</body>
</html>
