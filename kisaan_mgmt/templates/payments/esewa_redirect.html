{% extends 'accounts/farmer_base.html' %}
{% load i18n %}

{% block title %}{% trans "Redirecting to eSewa" %}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 p-8 bg-white border border-gray-300 rounded-xl shadow-xl text-center animate-fadeIn">
  <form action="https://rc.esewa.com.np/epay/main" method="POST" id="esewaForm" class="space-y-6">
    <input type="hidden" name="tAmt" value="{{ total }}">
    <input type="hidden" name="amt" value="{{ amount }}">
    <input type="hidden" name="txAmt" value="{{ tax }}">
    <input type="hidden" name="psc" value="{{ psc }}">
    <input type="hidden" name="pdc" value="{{ pdc }}">
    <input type="hidden" name="scd" value="{{ merchant_code }}">
    <input type="hidden" name="pid" value="{{ pid }}">
    <input type="hidden" name="su" value="{{ success_url }}">
    <input type="hidden" name="fu" value="{{ failure_url }}">

    <p class="text-xl font-semibold text-gray-800 mb-8">
      {% trans "Redirecting to" %}
      <span class="text-green-600 font-extrabold tracking-wide">eSewa</span>
      {% trans "for" %}
      <span class="text-green-700 text-2xl font-bold">Rs. {{ total }}</span>...
    </p>
    
    <button
      type="submit"
      class="w-full bg-green-600 hover:bg-green-700 active:bg-green-800 focus:outline-none focus:ring-4 focus:ring-green-300 text-white font-bold py-4 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105"
      aria-label="{% trans 'Pay with eSewa' %}"
    >
      {% trans "Pay with eSewa Now" %}
    </button>
  </form>
</div>

<style>
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fadeIn {
    animation: fadeIn 0.7s ease forwards;
  }
</style>

<script>
  // Auto-submit the form after 1 second
  setTimeout(() => {
    document.getElementById('esewaForm').submit();
  }, 1000);
</script>
{% endblock %}
