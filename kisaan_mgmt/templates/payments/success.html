{% load i18n %}
<!DOCTYPE html>
<html>
<head>
    <title>{% trans "Payment Success" %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6ffed;
            text-align: center;
            padding: 50px;
        }
        .box {
            background-color: #fff;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            display: inline-block;
            padding: 30px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #4CAF50;
        }
        p {
            font-size: 18px;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #3e8e41;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>{% trans "Payment Successful!" %}</h2>
        <p>{% blocktrans %}Thank you. Your payment of Rs. {{ amount }} was successful.{% endblocktrans %}</p>
        <p>{% trans "Transaction ID" %}: {{ pid }}</p>

        <a href="{% url 'customer-dashboard' %}">{% trans "Go back to Dashboard" %}</a>
    </div>
</body>
</html>
