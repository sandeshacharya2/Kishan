{% extends "accounts/farmer_base.html" %}
{% load static %}

{% block title %}Choose Payment Method{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 p-8 bg-white border border-gray-300 rounded-xl shadow-xl text-center">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">
    Choose Payment Method for <span class="text-green-600">{{ product.sub_category }}</span>
  </h2>
  
  <p class="mb-4">Quantity: {{ quantity }}</p>
  <p class="mb-6 font-semibold text-green-700 text-xl">Total: Rs. {{ amount }}</p>

  <!-- eSewa Button -->
  <form method="POST" action="{% url 'payments:payment_request' product.id %}" class="mb-4">
    {% csrf_token %}
    <input type="hidden" name="quantity" value="{{ quantity }}">
    <input type="hidden" name="payment_method" value="Esewa">
    <button type="submit"
      class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg transition">
      Pay with eSewa
    </button>
  </form>

  <!-- Cash on Delivery Button -->
  <form method="POST" action="{% url 'payments:payment_request' product.id %}">
    {% csrf_token %}
    <input type="hidden" name="quantity" value="{{ quantity }}">
    <input type="hidden" name="payment_method" value="COD">
    <button type="submit"
      class="w-full py-3 bg-gray-600 hover:bg-gray-700 text-white font-bold rounded-lg transition">
      Cash on Delivery
    </button>
  </form>
</div>
{% endblock %}
