{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% trans "Choose Payment Method" %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full mx-auto mt-8 p-8 bg-white border border-gray-300 rounded-xl shadow-xl text-center">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">
      {% trans "Choose Payment Method for" %} <span class="text-green-600">{{ product.sub_category }}</span>
    </h2>

    <p class="mb-4">{% trans "Quantity" %}: {{ quantity }}</p>
    <p class="mb-6 font-semibold text-green-700 text-xl">{% trans "Total" %}: Rs. {{ amount }}</p>

    <!-- eSewa Button -->
    <form method="POST" action="{% url 'payments:payment_request' product.id %}" class="mb-4">
      {% csrf_token %}
      <input type="hidden" name="quantity" value="{{ quantity }}" />
      <input type="hidden" name="payment_method" value="Esewa" />
      <button type="submit"
        class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg transition duration-200">
        {% trans "Pay with eSewa" %}
      </button>
    </form>

    <!-- Cash on Delivery Button -->
    <form method="POST" action="{% url 'payments:payment_request' product.id %}">
      {% csrf_token %}
      <input type="hidden" name="quantity" value="{{ quantity }}" />
      <input type="hidden" name="payment_method" value="COD" />
      <button type="submit"
        class="w-full py-3 bg-gray-600 hover:bg-gray-700 text-white font-bold rounded-lg transition duration-200">
        {% trans "Cash on Delivery" %}
      </button>
    </form>
  </div>
</body>
</html>
