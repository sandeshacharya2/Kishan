<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Rejected</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .card-container {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="bg-gray-50">

<div class="flex items-center justify-center min-h-screen px-4">
    <div class="text-center p-8 bg-white rounded-2xl shadow-xl card-container max-w-md w-full">
        <!-- Icon -->
        <div class="mb-6 flex justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="text-red-500" viewBox="0 0 16 16">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
            </svg>
        </div>

        <!-- Title -->
        <h2 class="text-2xl font-bold text-gray-800 mb-3">Chat Rejected</h2>

        <!-- Message -->
        <p class="text-gray-600 leading-relaxed mb-6">The farmer has declined your chat request.</p>

        <!-- Button -->
        <a href="{% url 'customer-dashboard' %}" class="inline-block px-8 py-3 bg-blue-600 text-white font-semibold rounded-full shadow-lg hover:bg-blue-700 hover:shadow-xl transition-all duration-200 transform hover:-translate-y-1">
            Go to Dashboard
        </a>

        <!-- Subtle footer -->
        <p class="mt-6 text-sm text-gray-400">
            You can always start a new chat with another farmer.
        </p>
    </div>
</div>

<!-- Optional: Add Alpine.js if you need interactivity later -->
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

</body>
</html>
